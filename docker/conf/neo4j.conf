# Neo4j configuration for the AuthentiCity graphs.
#
# ============================ SIZE THIS FIRST ============================
# The two memory settings below are the ones that matter, and the defaults
# here target a machine that gives Docker roughly 64 GiB or more.
#
#   * Check what the container actually sees:  docker info | grep "Total Memory"
#   * Keep heap + pagecache under about 80 % of that, or Neo4j will fail to
#     start or will swap.
#   * These graphs are 0.28 to 99 GiB on disk and the workloads are
#     random-access index lookups over the whole store, so the page cache is
#     what determines whether queries are memory bound or disk bound. The
#     image default of 512 MB makes everything disk bound.
#
# Suggested starting points:
#   16 GiB machine, Hamburg or Helsinki : heap 4g,  pagecache 6g
#   32 GiB machine, up to Zurich or NYC : heap 8g,  pagecache 16g
#   64 GiB machine or more, any city    : heap 16g, pagecache 32g   (as below)
# ========================================================================
server.memory.heap.initial_size=16g
server.memory.heap.max_size=16g
server.memory.pagecache.size=32g

# Listen on all interfaces inside the container; the compose file decides what
# is published on the host. Do NOT expose these ports to an untrusted network
# while the default password is in place.
server.default_listen_address=0.0.0.0
server.bolt.enabled=true
server.bolt.listen_address=0.0.0.0:7687
server.http.enabled=true
server.http.listen_address=0.0.0.0:7474
server.https.enabled=false

# Plugin procedures used by the dataset and the benchmark harness:
#   spatial.*  R-tree layers, required for the spatial question category
#   apoc.*     schema introspection, required by the harness
#   gds.*      optional, only for embedding work
dbms.security.procedures.unrestricted=apoc.*,spatial.*,gds.*
dbms.security.procedures.allowlist=apoc.*,spatial.*,gds.*

server.directories.import=import

# Raise this if a very large export or an ad-hoc whole-city aggregation hits
# the transaction memory limit. The released graphs need no special value for
# ordinary queries or for the benchmark gold queries.
# dbms.memory.transaction.total.max=8g
